_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: Soapbox Rate Request Bot
  description: Internal rate request intake and tracking for Soapbox.
  background_color: "#1f4f46"
features:
  bot_user:
    display_name: Soapbox Rate Request Bot
    always_online: true
  slash_commands:
    - command: /rate-request
      description: Submit a new rate request
      usage_hint: "brand, lead email, description"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - users:read
      - users:read.email
      - files:read
      - files:write
      - im:write
      - channels:read
      - channels:history
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
